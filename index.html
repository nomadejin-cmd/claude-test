<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영수증 분석기</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.5),
                             0 0 20px rgba(0, 255, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.8),
                             0 0 30px rgba(0, 255, 255, 0.5);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 255, 0.03) 2px,
                    rgba(0, 255, 255, 0.03) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 255, 0.03) 2px,
                    rgba(0, 255, 255, 0.03) 4px
                );
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #00ffff;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            letter-spacing: 3px;
            animation: glow 3s ease-in-out infinite;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(15, 20, 40, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5),
                        0 0 60px rgba(0, 255, 255, 0.1);
        }

        .panel h2 {
            color: #ff00ff;
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .upload-area {
            border: 2px dashed rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 255, 255, 0.05);
        }

        .upload-area:hover {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #e0e0e0;
            font-size: 1.1em;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
        }

        #previewImage {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00ffff;
            font-size: 1em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(255, 0, 255, 0.2) 100%);
            color: #00ffff;
            border-color: #00ffff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .btn-secondary {
            background: rgba(255, 0, 255, 0.1);
            color: #ff00ff;
            border-color: #ff00ff;
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(0, 255, 255, 0.1);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        .loading-text {
            color: #00ffff;
            font-size: 1em;
        }

        .result-panel {
            margin-top: 30px;
        }

        .extracted-data {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }

        .data-item {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .data-item strong {
            color: #ff00ff;
            display: inline-block;
            width: 120px;
        }

        .data-item span {
            color: #e0e0e0;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 영수증 분석기</h1>

        <div class="main-content">
            <!-- 이미지 업로드 패널 -->
            <div class="panel">
                <h2>📸 이미지 업로드</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">
                        클릭하거나 드래그하여 영수증 이미지를 업로드하세요
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*">

                <div class="preview-container">
                    <img id="previewImage" style="display: none;">
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">이미지 분석 중...</div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 분석하기</button>
                </div>
            </div>

            <!-- 추출 정보 패널 -->
            <div class="panel">
                <h2>📝 추출된 정보</h2>

                <div class="form-group">
                    <label for="receiptNumber">전표번호</label>
                    <input type="text" id="receiptNumber" placeholder="전표번호가 표시됩니다">
                </div>

                <div class="form-group">
                    <label for="customerName">고객명</label>
                    <input type="text" id="customerName" placeholder="고객명이 표시됩니다">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">전화번호</label>
                    <input type="text" id="phoneNumber" placeholder="전화번호가 표시됩니다">
                </div>

                <div class="form-group">
                    <label for="address">주소</label>
                    <input type="text" id="address" placeholder="주소가 표시됩니다">
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" id="saveBtn">💾 저장하기</button>
                    <button class="btn btn-secondary" id="resetBtn">🔄 초기화</button>
                </div>

                <div class="result-panel" id="resultPanel" style="display: none;">
                    <h3 style="color: #00ffff; margin-bottom: 10px;">✅ 저장된 데이터</h3>
                    <div class="extracted-data" id="savedData"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const savedData = document.getElementById('savedData');

        let currentImageFile = null;

        // 업로드 영역 클릭
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 파일 선택
        fileInput.addEventListener('change', handleFileSelect);

        // 드래그 앤 드롭
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드 가능합니다.');
                return;
            }

            currentImageFile = file;
            const reader = new FileReader();

            reader.onload = function(e) {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                analyzeBtn.disabled = false;
            };

            reader.readAsDataURL(file);
        }

        // 이미지 분석
        analyzeBtn.addEventListener('click', async () => {
            if (!currentImageFile) return;

            loading.classList.add('active');
            analyzeBtn.disabled = true;
            document.querySelector('.loading-text').textContent = '이미지 분석 준비 중...';

            try {
                const result = await Tesseract.recognize(
                    currentImageFile,
                    'kor+eng',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                document.querySelector('.loading-text').textContent =
                                    `이미지 분석 중... ${Math.round(m.progress * 100)}%`;
                            } else if (m.status) {
                                document.querySelector('.loading-text').textContent =
                                    `${m.status}...`;
                            }
                        }
                    }
                );

                const text = result.data.text;
                console.log('추출된 텍스트:', text);

                if (!text || text.trim().length === 0) {
                    alert('이미지에서 텍스트를 추출할 수 없습니다.\n더 선명한 이미지를 사용해주세요.');
                    loading.classList.remove('active');
                    analyzeBtn.disabled = false;
                    return;
                }

                // 정보 추출
                document.querySelector('.loading-text').textContent = '정보 추출 중...';
                const extractedCount = extractInformation(text);

                loading.classList.remove('active');
                analyzeBtn.disabled = false;

                // 결과 피드백
                if (extractedCount === 0) {
                    alert('⚠️ 정보를 추출할 수 없습니다.\n\n다음을 확인해주세요:\n1. 이미지가 선명한가요?\n2. 한글이 포함되어 있나요?\n3. 전표번호, 고객명, 전화번호, 주소가 있나요?\n\n콘솔(F12)에서 추출된 텍스트를 확인해보세요.');
                } else {
                    alert(`✅ 분석 완료!\n\n${extractedCount}개의 정보를 추출했습니다.\n확인 후 필요시 수정해주세요.`);
                }

            } catch (error) {
                console.error('OCR 오류:', error);
                alert('❌ 이미지 분석 중 오류가 발생했습니다.\n\n' + error.message);
                loading.classList.remove('active');
                analyzeBtn.disabled = false;
            }
        });

        function extractInformation(text) {
            // 전표번호 추출 (영수증 번호, 배달번호, 배달전표, 번호, 전표번호)
            const receiptPatterns = [
                /영수증\s*번호[:\s]*([A-Z0-9-():]+)/i,
                /(?:배달번호|배달전표|전표번호)[:\s]*([A-Z0-9-():]+)/i,
                /번호[:\s]*([A-Z0-9-():]+)/i,
                /(?:배달|전표)[:\s]*[*\s]*[:\s]*([A-Z0-9-():]+)/i
            ];

            for (const pattern of receiptPatterns) {
                const match = text.match(pattern);
                if (match) {
                    // 영수증 번호는 그대로, 시간 형식은 숫자만 추출
                    let value = match[1].trim();
                    // 알파벳이 포함되어 있으면 그대로 (C6691300944)
                    // 시간 형식이면 숫자만 추출 (1-(09:20) → 10920)
                    if (!/[A-Z]/i.test(value)) {
                        value = value.replace(/[^0-9]/g, '');
                    }
                    if (value) {
                        document.getElementById('receiptNumber').value = value;
                        break;
                    }
                }
            }

            // 전화번호 추출 (H.P 포함, 여러 패턴 지원)
            const phonePatterns = [
                /H\.P[:\s.]*([0-9-]{10,13})/i,
                /HP[:\s.]*([0-9-]{10,13})/i,
                /(?:전화|TEL|연락처)[:\s]*([0-9-]{10,13})/i,
                // 010으로 시작하는 휴대폰 번호만 (엄격한 패턴)
                /\b(010[-\s]?\d{3,4}[-\s]?\d{4})\b/,
                // 일반 전화번호 (02, 031 등으로 시작)
                /\b(0\d{1,2}[-\s]\d{3,4}[-\s]\d{4})\b/
            ];

            for (const pattern of phonePatterns) {
                const match = text.match(pattern);
                if (match) {
                    let phone = match[1].replace(/\s/g, '');

                    // 하이픈이 없으면 추가
                    if (!phone.includes('-')) {
                        if (phone.startsWith('010')) {
                            // 010-XXXX-XXXX 형식
                            phone = phone.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
                        } else if (phone.startsWith('02')) {
                            // 02-XXX-XXXX 또는 02-XXXX-XXXX
                            if (phone.length === 9) {
                                phone = phone.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
                            } else {
                                phone = phone.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
                            }
                        } else {
                            // 지역번호-XXX-XXXX 또는 지역번호-XXXX-XXXX
                            if (phone.length === 10) {
                                phone = phone.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
                            } else {
                                phone = phone.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
                            }
                        }
                    }

                    document.getElementById('phoneNumber').value = phone;
                    break;
                }
            }

            // 고객명 추출 (성명: 값)
            const namePatterns = [
                /성명[:\s]*([가-힣*\s]+?)(?=\n|$|H\.P|HP|전화|TEL|주소)/i,
                /이름[:\s]*([가-힣*]{2,10})/,
                /고객[:\s]*([가-힣*]{2,10})/
            ];

            for (const pattern of namePatterns) {
                const match = text.match(pattern);
                if (match) {
                    const name = match[1].trim().replace(/\s+/g, '');
                    if (name) {
                        document.getElementById('customerName').value = name;
                        break;
                    }
                }
            }

            // 주소 추출 (주소: 값 또는 주소 : 값)
            const addressPatterns = [
                // 1. 한 줄 주소 (가장 일반적)
                /주소\s*[:\s]\s*([^\n]+)/i,
                // 2. 여러 줄 주소 (다음 키워드 전까지)
                /주소[:\s]*(.+?)(?=\n.*(?:TEL|H\.P|HP|전화|비고|배달번호|배달전표|영수증|도착|출발|메모))/is,
                // 3. *배달 전까지
                /주소[:\s]*(.+?)(?=\*배달)/is
            ];

            for (const pattern of addressPatterns) {
                const match = text.match(pattern);
                if (match) {
                    // 줄바꿈을 공백으로 변경하고 trim, 여러 공백을 하나로
                    let address = match[1]
                        .replace(/\n/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim();

                    // 불필요한 정보 제거 (건물명 등이 따로 있는 경우)
                    // 예: "경기도 용인시 기흥구 공세동 296-55\n아우토서비스 건" → "경기도 용인시 기흥구 공세동 296-55"

                    if (address) {
                        document.getElementById('address').value = address;
                        break;
                    }
                }
            }

            // 자동 추출이 안된 경우 전체 텍스트에서 수동으로 확인할 수 있도록 콘솔에 출력
            console.log('전체 추출 텍스트:\n', text);

            // 추출된 데이터 개수 계산
            let extractedCount = 0;
            if (document.getElementById('receiptNumber').value) extractedCount++;
            if (document.getElementById('customerName').value) extractedCount++;
            if (document.getElementById('phoneNumber').value) extractedCount++;
            if (document.getElementById('address').value) extractedCount++;

            // 추출된 필드 강조 표시
            ['receiptNumber', 'customerName', 'phoneNumber', 'address'].forEach(id => {
                const input = document.getElementById(id);
                if (input.value) {
                    input.style.borderColor = '#00ffff';
                    input.style.background = 'rgba(0, 255, 255, 0.1)';
                } else {
                    input.style.borderColor = 'rgba(255, 0, 255, 0.3)';
                    input.style.background = 'rgba(255, 0, 255, 0.05)';
                }
            });

            return extractedCount;
        }

        // 저장하기
        saveBtn.addEventListener('click', () => {
            const data = {
                receiptNumber: document.getElementById('receiptNumber').value,
                customerName: document.getElementById('customerName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                address: document.getElementById('address').value
            };

            if (!data.receiptNumber && !data.customerName && !data.phoneNumber && !data.address) {
                alert('저장할 데이터가 없습니다.');
                return;
            }

            // 저장된 데이터 표시
            savedData.innerHTML = `
                <div class="data-item">
                    <strong>전표번호:</strong>
                    <span>${data.receiptNumber || '-'}</span>
                </div>
                <div class="data-item">
                    <strong>고객명:</strong>
                    <span>${data.customerName || '-'}</span>
                </div>
                <div class="data-item">
                    <strong>전화번호:</strong>
                    <span>${data.phoneNumber || '-'}</span>
                </div>
                <div class="data-item">
                    <strong>주소:</strong>
                    <span>${data.address || '-'}</span>
                </div>
            `;

            resultPanel.style.display = 'block';

            // localStorage에 저장
            localStorage.setItem('receiptData', JSON.stringify(data));

            alert('데이터가 저장되었습니다!');
        });

        // 초기화
        resetBtn.addEventListener('click', () => {
            if (confirm('모든 데이터를 초기화하시겠습니까?')) {
                document.getElementById('receiptNumber').value = '';
                document.getElementById('customerName').value = '';
                document.getElementById('phoneNumber').value = '';
                document.getElementById('address').value = '';
                previewImage.style.display = 'none';
                previewImage.src = '';
                currentImageFile = null;
                analyzeBtn.disabled = true;
                resultPanel.style.display = 'none';
                localStorage.removeItem('receiptData');
            }
        });

        // 페이지 로드 시 저장된 데이터 불러오기
        window.onload = function() {
            const savedDataStr = localStorage.getItem('receiptData');
            if (savedDataStr) {
                const data = JSON.parse(savedDataStr);
                document.getElementById('receiptNumber').value = data.receiptNumber || '';
                document.getElementById('customerName').value = data.customerName || '';
                document.getElementById('phoneNumber').value = data.phoneNumber || '';
                document.getElementById('address').value = data.address || '';

                if (data.receiptNumber || data.customerName || data.phoneNumber || data.address) {
                    saveBtn.click();
                }
            }
        };
    </script>
</body>
</html>
